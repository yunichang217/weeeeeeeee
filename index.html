<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>👾 生活管理</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e6e3df">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="生活管理">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: iOS-style grouped lists — gray canvas, white rounded groups, small grey section headers, one accent; max 1000px, two columns on desktop */
  --bg:#e6e3df;
  --card:#fbfaf8;
  --ink:#3b3531;
  --muted:#9a9089;
  --sep:rgba(90,75,65,.14);
  --fill:#ebe7e2;
  --accent:#8c7b70;   /* taupe */
  --green:#8d9a84;    /* sage */
  --orange:#b9996b;   /* oat */
  --red:#b9837a;      /* dusty rose */
  --indigo:#9a8796;   /* mauve */
  --teal:#8b9599;     /* stone grey */
  --font:"Huninn","jf open 粉圓 2.1","Arial Rounded MT Bold","PingFang TC",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1d1a18; --card:#282421; --ink:#ede6de; --muted:#a2988f; --sep:rgba(200,185,170,.16); --fill:#34302c;
    --accent:#c2b0a3; --green:#a9b59f; --orange:#d2b688; --red:#d3a097; --indigo:#bba7b5; --teal:#a9b2b6;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1d1a18; --card:#282421; --ink:#ede6de; --muted:#a2988f; --sep:rgba(200,185,170,.16); --fill:#34302c;
  --accent:#c2b0a3; --green:#a9b59f; --orange:#d2b688; --red:#d3a097; --indigo:#bba7b5; --teal:#a9b2b6;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15.5px;line-height:1.5;letter-spacing:.02em;-webkit-font-smoothing:antialiased}
body{font-variant-numeric:tabular-nums;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}

/* top bar */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--sep);padding-top:env(safe-area-inset-top)}
.top-inner{max-width:1000px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px}
.brand{font-weight:600;font-size:1rem}
.sync{font-size:.72rem;color:var(--muted)}
nav.tabs{display:flex;gap:2px;margin-left:auto;background:var(--fill);border-radius:9px;padding:2px}
nav.tabs a{padding:5px 14px;border-radius:7px;text-decoration:none;color:var(--ink);font-size:.86rem;font-weight:500}
nav.tabs a[aria-current="page"]{background:var(--card);box-shadow:0 1px 3px rgba(60,45,35,.12),0 0 0 .5px rgba(0,0,0,.04)}
.ti{display:none;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:700px){
  .top{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg);border-bottom:0}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;margin:0;border-radius:0;background:color-mix(in srgb,var(--card) 92%,transparent);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid var(--sep);
    padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;z-index:6}
  nav.tabs a span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  nav.tabs a{flex:1;min-width:0;text-align:center;font-size:.66rem;color:var(--muted);padding:4px 2px 2px;display:flex;flex-direction:column;align-items:center;gap:2px}
  nav.tabs a .ti{display:block}
  nav.tabs a[aria-current="page"]{background:none;box-shadow:none;color:var(--ink);font-weight:700}
  nav.tabs a[aria-current="page"] .ti{stroke-width:2}
}

main{max-width:1000px;margin:0 auto;padding:8px 20px 24px;display:grid;gap:22px}
@media (max-width:700px){main{padding:4px 16px 20px;gap:20px}}
.large{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:10px}
.large h1{font-size:2rem;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.large .sub{color:var(--muted);font-size:.9rem;margin-top:2px}

/* grouped sections */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;align-items:start}
@media (max-width:860px){.grid3{grid-template-columns:1fr 1fr}}
@media (max-width:700px){.grid2,.grid3{grid-template-columns:1fr;gap:20px}}
.sec{display:grid;gap:6px;min-width:0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;padding:0 16px;font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.sec-h b{font-weight:400}
.sec-f{padding:0 16px;font-size:.76rem;color:var(--muted)}
.group{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(90,70,55,.04)}
.pad{padding:14px 16px;display:grid;gap:12px}
.rowi{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:46px;position:relative}
.rowi + .rowi::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.rowi.inset + .rowi.inset::before{left:52px}
.rowi .main{flex:1 1 0;min-width:0}
.rowi .t{display:block}
.rowi .s{display:block;font-size:.8rem;color:var(--muted);margin-top:1px}
.rowi .v{color:var(--muted);white-space:nowrap}
.rowi .v.strong{color:var(--ink);font-weight:500}
.rowi.total .main,.rowi.total .v{font-weight:600;color:var(--ink)}
.rowi.tap{cursor:pointer}
.rowi.tap:active{background:var(--fill)}
.empty{padding:14px 16px;color:var(--muted);font-size:.9rem}
.datepill{display:inline-block;padding:3px 11px;border-radius:99px;background:var(--fill);color:var(--ink);font-size:.8rem;white-space:nowrap}
.datepill.today{background:var(--accent);color:#fff}
.datepill.done{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}

/* summary widgets */
.widgets{display:grid;grid-template-columns:1fr 2fr;gap:12px}
.wdg{background:var(--card);border-radius:20px;box-shadow:0 1px 2px rgba(90,70,55,.04);padding:14px 16px;display:grid;gap:2px;align-content:start}
.wdg .k{font-size:.78rem;color:var(--muted);font-weight:500}
.wdg .n{font-size:1.75rem;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.wdg .x{font-size:.76rem;color:var(--muted)}
.wdg.main .n{font-size:2.2rem;color:var(--accent)}
.wdg .wlink{all:unset;cursor:pointer;font-size:.76rem;color:var(--muted);justify-self:start;border-radius:6px}
.wdg .wlink:hover{color:var(--accent)}
.wdg .wlink:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pl-acts{display:flex;gap:2px;align-items:center}
.pl-acts button{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:8px;color:var(--muted)}
.pl-acts button:hover{background:var(--fill);color:var(--ink)}
.pl-acts button.del:hover{color:var(--red)}
button.wdg.wbtn{font:inherit;color:inherit;text-align:left;border:0;cursor:pointer;transition:background .15s}
button.wdg.wbtn:hover{background:color-mix(in srgb,var(--fill) 55%,var(--card))}
button.wdg.wbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wdg .wl .meter{margin-top:6px;grid-column:1/-1}
.catd>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:12px 16px;border-bottom:.5px solid var(--sep)}
.catd>summary::-webkit-details-marker{display:none}
:root{--c-fixed:#7d5b4a;--c-meal:#c48a4a;--c-save:#5c76ab;--c-spend:#c26a83;--c-inc:#a39a92}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c-fixed:#80635a;--c-meal:#bf9032;--c-save:#6c86c3;--c-spend:#cd7491;--c-inc:#7d746d}}
:root[data-theme="dark"]{--c-fixed:#80635a;--c-meal:#bf9032;--c-save:#6c86c3;--c-spend:#cd7491;--c-inc:#7d746d}
.hatch{background-image:repeating-linear-gradient(45deg,transparent 0 3px,rgba(255,255,255,.55) 3px 5px)!important}
.ov-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-bottom:.5px solid var(--sep)}
.ov-tile{all:unset;cursor:pointer;padding:14px 16px;display:grid;gap:2px;border-right:.5px solid var(--sep)}
.ov-tile:last-child{border-right:0}
.ov-tile:hover{background:color-mix(in srgb,var(--fill) 55%,var(--card))}
.ov-tile:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.ov-tile .k{font-size:.78rem;color:var(--muted)}
.ov-tile .n{font-size:1.45rem;font-weight:700;letter-spacing:-.02em}
.ov-tile .x{font-size:.74rem;color:var(--muted)}
.alloc{display:flex;height:14px;gap:2px;margin:16px 16px 10px}
.alloc span{display:block;height:100%;min-width:2px}
.alloc span:first-child{border-radius:4px 0 0 4px}.alloc span:last-child{border-radius:0 4px 4px 0}
.alloc-legend{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 10px;padding:0 10px 12px}
.alloc-legend button{all:unset;cursor:pointer;display:grid;grid-template-columns:10px 1fr auto;align-items:center;gap:6px;padding:6px;border-radius:8px;font-size:.85rem}
.alloc-legend button:hover{background:color-mix(in srgb,var(--fill) 55%,var(--card))}
.alloc-legend i{width:10px;height:10px;border-radius:3px;display:block}
.alloc-legend b{font-weight:600}
.alloc-legend .pc{color:var(--muted);font-size:.75rem;margin-left:4px}
.chart{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--font)}
.chart .grid{stroke:var(--sep);stroke-width:1}
.chart .base{stroke:var(--muted);stroke-width:1;opacity:.5}
.chart .ref{stroke:var(--ink);stroke-width:1;stroke-dasharray:3 3;opacity:.45}
.chart [data-tip]{cursor:default}
.chart [data-tip]:hover{opacity:.8}
.chart-wrap{padding:12px 14px 8px}
.chart-legend{display:flex;flex-wrap:wrap;gap:4px 14px;padding:0 16px 12px;font-size:.78rem;color:var(--muted)}
.chart-legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:middle}
.cbar:first-child{margin-top:6px}
.rowi.bill.done .t{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent)}
.rowi.bill.done .v{color:var(--muted)}
.rowi.bill .main{cursor:pointer}
.rowi .life{display:block;height:3px;border-radius:99px;background:var(--fill);overflow:hidden;margin-top:6px;max-width:220px}
.rowi .life span{display:block;height:100%;border-radius:99px}
.seg.sm button{padding:3px 10px;font-size:.78rem}
.ov-tile .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbar{display:grid;grid-template-columns:5.5em 1fr auto;align-items:center;gap:10px;padding:8px 16px;cursor:pointer}
.cbar:hover{background:color-mix(in srgb,var(--fill) 55%,var(--card))}
.cbar .tr{height:8px;background:var(--fill);border-radius:99px;overflow:hidden}
.cbar .tr span{display:block;height:100%;border-radius:99px;background:var(--accent)}
.cbar .lb{font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbar .vl{font-size:.85rem;text-align:right;white-space:nowrap}
.cbar .vl small{color:var(--muted);margin-left:4px}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--card);font-size:.78rem;padding:6px 9px;border-radius:8px;white-space:pre;opacity:0;transition:opacity .1s;max-width:240px}
@media (max-width:700px){.ov-tiles{grid-template-columns:1fr 1fr}.ov-tile:nth-child(2){border-right:0}.ov-tile:nth-child(-n+2){border-bottom:.5px solid var(--sep)}.alloc-legend{grid-template-columns:1fr 1fr}}
.recur-bar{display:flex;height:12px;border-radius:99px;overflow:hidden;margin:14px 16px 8px;gap:2px}
.recur-bar span{display:block;height:100%}
.ritem{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 16px 10px 28px;border-bottom:.5px solid var(--sep);font-size:.92rem}
.ritem .rv{text-align:right;white-space:nowrap}
.ritem.tap{cursor:pointer}
.ritem.tap:hover{background:color-mix(in srgb,var(--fill) 55%,var(--card))}
.recur-legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:0 16px 10px;font-size:.8rem;color:var(--muted)}
.recur-legend i{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:5px;vertical-align:middle}
.catd .sumrow{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:12px 16px;border-bottom:.5px solid var(--sep)}
.wl.tapw{cursor:pointer;border-radius:10px;margin:-4px -6px;padding:4px 6px;transition:background .15s}
.wl.tapw:hover{background:color-mix(in srgb,var(--fill) 55%,var(--card))}
.wl.tapw:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.catd>summary:hover,.catd[open]>summary{background:color-mix(in srgb,var(--fill) 55%,var(--card))}
.catd>summary .meter{grid-column:1/-1;height:4px;border-radius:99px;background:var(--fill);overflow:hidden;margin-top:4px}
.catd>summary .meter span{display:block;height:100%;background:var(--accent);border-radius:99px}
.wdg .wpair{display:grid;grid-template-columns:1fr 1fr;gap:4px 20px;margin-top:2px}
.wdg .wl{display:grid;align-content:start}
.wdg .wl .wk{font-size:.86rem}
.wdg .wl .wv{font-size:1.75rem;font-weight:700;letter-spacing:-.02em;line-height:1.2}
@media (max-width:700px){
  .wdg .wpair{grid-template-columns:1fr;gap:0}
  .wdg .wl{grid-template-columns:auto 1fr;align-items:baseline;column-gap:8px;margin-top:4px}
  .wdg .wl .wv{font-size:1.3rem;text-align:right}
  .wdg .wl .x{grid-column:1/-1;text-align:right}
  .wdg .wlink.pl{justify-self:end}
}
.wdg .meter{height:4px;border-radius:99px;background:var(--fill);overflow:hidden;margin-top:8px}
.wdg .meter span{display:block;height:100%;background:var(--accent);border-radius:99px}
.wdg .meter.over span{background:var(--red)}
@media (max-width:700px){.widgets{grid-template-columns:1fr 1fr;gap:10px}.wdg.main{grid-column:1/-1}.wdg .n{font-size:1.45rem}.wdg.main .n{font-size:2rem}}

/* controls */
.seg{display:inline-flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 16px;border-radius:7px;cursor:pointer;font-size:.86rem;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(60,45,35,.12),0 0 0 .5px rgba(0,0,0,.04)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.datenav{display:flex;align-items:center;gap:4px}
.datenav strong{font-weight:600;min-width:11.5em;text-align:center;font-size:.95rem}
.link{border:0;background:none;color:var(--accent);cursor:pointer;padding:6px 8px;font-size:.92rem;border-radius:8px}
.link:hover{background:var(--fill)}
.link:disabled{color:var(--muted);opacity:.4;cursor:default;background:none}
.link.red{color:var(--red)}
.link.big{font-size:1.25rem;line-height:1;padding:4px 10px}
.btn{border:0;background:var(--accent);color:#fff;border-radius:99px;padding:8px 16px;cursor:pointer;font-weight:600;font-size:.9rem}
.btn.gray{background:var(--fill);color:var(--accent)}
.btn.sm{padding:5px 12px;font-size:.82rem;border-radius:99px}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* check circle (Reminders style) */
.check{width:22px;height:22px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--muted) 70%,transparent);background:none;cursor:pointer;flex-shrink:0;padding:0;position:relative}
.check[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.check[aria-checked="true"]::after{content:"";position:absolute;left:7px;top:3px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.rowi.done .t{color:var(--muted);text-decoration:line-through}

/* tags */
.tag{display:inline-block;font-size:.72rem;font-weight:500;padding:1px 7px;border-radius:6px;white-space:nowrap;vertical-align:1px}
.tag.ok{color:var(--green);background:color-mix(in srgb,var(--green) 13%,transparent)}
.tag.warn{color:var(--orange);background:color-mix(in srgb,var(--orange) 14%,transparent)}
.tag.crit{color:var(--red);background:color-mix(in srgb,var(--red) 12%,transparent)}
.tag.none,.tag.gray{color:var(--muted);background:var(--fill)}
.tag.info{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.tag.tutor{color:var(--teal);background:color-mix(in srgb,var(--teal) 13%,transparent)}
.tag.workout{color:var(--indigo);background:color-mix(in srgb,var(--indigo) 12%,transparent)}
.tag.task{color:var(--accent);background:color-mix(in srgb,var(--accent) 11%,transparent)}
.tag.supply{color:var(--orange);background:color-mix(in srgb,var(--orange) 14%,transparent)}
.tag.health{color:var(--green);background:color-mix(in srgb,var(--green) 13%,transparent)}
.neg{color:var(--red)!important}

/* workout */
.pips{display:flex;gap:5px}
.pip{width:12px;height:12px;border-radius:50%;background:var(--fill);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--indigo) 50%,transparent)}
.pip.on{background:var(--indigo);box-shadow:none}
.logbtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:12px 16px 14px}
.logbtns .btn{background:var(--fill);color:var(--indigo);font-weight:600}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--sep)}
.cal .wd{background:var(--card);font-size:.78rem;color:var(--muted);text-align:center;padding:8px 0 6px;font-weight:500;text-transform:uppercase}
.cal .day{border:0;background:var(--card);min-height:96px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:2px;cursor:pointer;min-width:0}
.cal .day:hover{background:var(--fill)}
.cal .day.other .dn{color:var(--muted);opacity:.5}
.cal .dn{font-size:.95rem;font-weight:500;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.cal .day.today .dn{background:var(--red);color:#fff;font-weight:700}
.cal .evs{display:flex;flex-direction:column;gap:1px;min-width:0}
.cal button.ev{border:0;background:none;text-align:left;cursor:pointer;font-family:inherit;border-radius:4px;width:100%}
.cal button.ev:hover{background:color-mix(in srgb,currentColor 12%,transparent)}
.cal .ev{font-size:.74rem;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:6px;position:relative}
.cal .ev::before{content:"";position:absolute;left:0;top:.42em;width:3px;height:3px;border-radius:50%;background:currentColor}
.ev.gcal{color:var(--ink)} .ev.tutor{color:var(--teal)} .ev.workout{color:var(--indigo)} .ev.task{color:var(--accent)} .ev.supply{color:var(--orange)} .ev.health{color:var(--green)}
.ev.isdone{opacity:.45;text-decoration:line-through}
.cal .sp{font-size:.72rem;color:var(--muted);margin-top:auto}
@media (max-width:560px){
  .cal .day{min-height:76px;padding:3px 2px;align-items:stretch}
  .cal .dn{font-size:.84rem;width:22px;height:22px;margin:0 auto 1px}
  .cal button.ev{font-size:.64rem;line-height:1.3;padding:1px 2px;border-radius:3px;background:color-mix(in srgb,currentColor 13%,transparent);text-align:center}
  .cal .ev::before{display:none}
  .cal .ev.more{background:none;color:var(--muted)}
  .cal .sp{display:none}
}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.74rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:4px;vertical-align:1px}

/* forms */

<script>
/* ===== 👾 公版試算表：收支表、薪資明細、參數（樣式比照原本的「薪資與收支規劃」） =====
   LIFE_BOOK(opts) 回傳建立試算表要用的 sheets 屬性、值（含公式）與格式。 */
const LIFE_BOOK = (() => {
  const FIXED_ROWS = 10, MONTHS = 12;
  const ID = {main: 11, pay: 12, par: 13, log: 14, app: 15};
  const rgb = h => ({red: +(parseInt(h.slice(1,3),16)/255).toFixed(3), green: +(parseInt(h.slice(3,5),16)/255).toFixed(3), blue: +(parseInt(h.slice(5,7),16)/255).toFixed(3)});
  const C = {navy:"#1F3864", gray:"#595959", inBg:"#EAF1FB", inFg:"#1F4E9E", line:"#D9D9D9", dark:"#8C8C8C", ink:"#262626", total:"#F2F2F2",
    inc:"#548235", incL:"#E2EFDA", fix:"#C55A11", fixL:"#FCE4D6", day:"#BF8F00", dayL:"#FFF2CC", sav:"#2E75B6", savL:"#DDEBF7", bal:"#7F6000", balL:"#FFE699", balBg:"#FFF9E6", purple:"#7030A0"};
  const NUM = '#,##0;(#,##0);"-"';
  const WD = "日一二三四五六";
  const col = n => { let s = ""; n++; while (n){ const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
  const ymAdd = (ym, k) => { const [y, m] = ym.split("-").map(Number), d = new Date(y, m - 1 + k, 1); return [d.getFullYear(), d.getMonth() + 1]; };
  const ymLabel = ([y, m]) => `${y}/${String(m).padStart(2, "0")}`;

  function build(o){
    const start = o.startYm, months = [...Array(MONTHS)].map((_, i) => ymAdd(start, i));
    const span = `${ymLabel(months[0])} – ${ymLabel(months[MONTHS - 1])}`;
    const data = [], req = [];
    const put = (sheet, a1, rows) => data.push({range: `'${sheet}'!${a1}`, values: rows});
    const G = (sid, r0, r1, c0, c1) => ({sheetId: sid, startRowIndex: r0, endRowIndex: r1, startColumnIndex: c0, endColumnIndex: c1});
    const fmt = (range, f) => {
      const uf = {}, fields = ["textFormat", "horizontalAlignment", "verticalAlignment"];
      const tf = {fontFamily: "Arial", fontSize: f.size || 10};
      if (f.bold) tf.bold = true;
      if (f.fg) tf.foregroundColor = rgb(f.fg);
      uf.textFormat = tf;
      if (f.bg){ uf.backgroundColor = rgb(f.bg); fields.push("backgroundColor"); }
      if (f.num){ uf.numberFormat = f.num === "date" ? {type: "DATE", pattern: "yyyy/mm"} : f.num === "pct" ? {type: "PERCENT", pattern: "0.00%"} : f.num === "text" ? {type: "TEXT"} : {type: "NUMBER", pattern: f.num}; fields.push("numberFormat"); }
      uf.horizontalAlignment = f.align || "CENTER"; uf.verticalAlignment = "MIDDLE";
      if (f.wrap){ uf.wrapStrategy = "WRAP"; fields.push("wrapStrategy"); }
      req.push({repeatCell: {range, cell: {userEnteredFormat: uf}, fields: fields.map(x => "userEnteredFormat." + x).join(",")}});
    };

<script>
/* ---------- helpers ---------- */
const WD = ["日","一","二","三","四","五","六"];
const WDE = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const WDF = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONF = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const ymOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const parseISO = s => { const [y,m,dd] = s.split("-").map(Number); return new Date(y, m-1, dd||1); };

const ymEn = ym => { const [y,m] = ym.split("-").map(Number); return `${MONF[m-1]} ${y}`; };
const ymZh = ym => `${Number(ym.slice(5))}月`;
const mdEn = d => `${MON[d.getMonth()]} ${d.getDate()}`;
const countWd = (ym, wds) => { const [y,m] = ym.split("-").map(Number); let c = 0;
  for (let i=1;i<=daysIn(ym);i++) if ((wds||[]).includes(new Date(y,m-1,i).getDay())) c++; return c; };
const money = n => (n<0?"−":"") + "$" + Math.abs(Math.round(n||0)).toLocaleString("en-US");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const clone = o => JSON.parse(JSON.stringify(o));
const sum = (a,f) => a.reduce((t,x) => t + (f ? f(x) : x), 0);
const TRASH = '<svg class="trash" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 7h15"/><path d="M9.5 7V5.2c0-.7.5-1.2 1.2-1.2h2.6c.7 0 1.2.5 1.2 1.2V7"/><path d="M6.5 7l.9 11.6c.1 1 .9 1.9 2 1.9h5.2c1.1 0 1.9-.8 2-1.9L17.5 7"/><path d="M10.2 11v5.5M13.8 11v5.5"/></svg>';
const PENCIL = '<svg class="trash" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 5.5l3 3"/><path d="M5 19l.8-3.6L16 5.2a1.5 1.5 0 0 1 2.1 0l.7.7a1.5 1.5 0 0 1 0 2.1L8.6 18.2z"/><path d="M4.5 20.5h15"/></svg>';
const today0 = () => parseISO(iso(new Date()));
const SPEND_CATS = ["餐飲","日用品","交通","娛樂","購物","醫療保健","運動","學習","其他"];
const DEFAULT_SUPPLY_CATS = ["保養品","卸妝","常備藥品","日用品","其他"];
const KIND = {monthly:"每月固定", usd:"美元計價", weekday:"依星期天數"};
const WORKOUT = {gym:"Gym", tennis:"Tennis", pilates:"Pilates"};
const COL_SPEND_CAT = {supplies:"日用品", health:"醫療保健"};
const EV_LABEL = {task:"任務", tutor:"家教", workout:"運動", supply:"補貨", health:"Self care", gcal:"Google 日曆"};
let MAXEV = 4; const mqSmall = matchMedia("(max-width:560px)"); const setMax = () => { MAXEV = mqSmall.matches ? 3 : 5; }; setMax(); mqSmall.addEventListener?.("change", () => { setMax(); render(); });
const RULE = {weekly:"每週", monthly:"每月", yearly:"每年", interval:"每隔幾天"};

/* ---------- state ---------- */
const S = { gcal:{}, gcalState:"off", gcalMsg:"", settings:null, supplies:[], health:[], tasks:[], installments:[], shopping:[], spend:{}, workouts:{}, taskdone:{}, bills:{} };
let db = null;
const ui = { tab:"home", view:"month", cursor:new Date(), month:null };
const startYm = () => S.settings?.startMonth || "2026-11";
const effYm = ym => ym < startYm() ? startYm() : ym;
const goals = () => ({gymPerWeek:2, racketDays:14, ...(S.settings?.goals||{})});
const spendCats = () => (S.settings?.spendCats && S.settings.spendCats.length) ? S.settings.spendCats : SPEND_CATS;
const supplyCats = () => (S.settings?.supplyCats && S.settings.supplyCats.length) ? S.settings.supplyCats : DEFAULT_SUPPLY_CATS;
const weekStart = d => addDays(d, -((d.getDay()+6)%7));

/* ---------- tasks ---------- */
function occursOn(t, d){
  const r = t.rule || {}; const ym = ymOf(d);
  if (t.since && iso(d) < t.since) return false;
  if (r.type === "weekly") return (r.weekdays||[]).includes(d.getDay());
  if (r.type === "monthly") return d.getDate() === Math.min(Number(r.day)||1, daysIn(ym));
  if (r.type === "yearly") return (r.months||[]).includes(d.getMonth()+1) && d.getDate() === Math.min(Number(r.day)||1, daysIn(ym));
  if (r.type === "interval"){ const n = Number(r.days)||0; if (!n || !r.start) return false; const k = dayDiff(d, parseISO(r.start)); return k >= 0 && k % n === 0; }
  return false;
}
function ruleText(t){
  const r = t.rule || {};
  if (r.type === "weekly") return (r.weekdays||[]).length === 7 ? "每天" : "每週" + [1,2,3,4,5,6,0].filter(w => (r.weekdays||[]).includes(w)).map(w => WD[w]).join("、");

  if (r.type === "yearly") return `每年 ${(r.months||[]).join("、")} 月 ${r.day} 日`;

}
const doneSet = () => new Set(Object.values(S.taskdone).flatMap(m => (m.items||[]).map(x => `${x.taskId}|${x.date}`)));
function nextOcc(t, from){ for (let i=0;i<400;i++){ const d = addDays(from,i); if (occursOn(t,d)) return d; } return null; }
function tasksOn(d){ const ds = doneSet(); return S.tasks.filter(t => occursOn(t,d)).map(t => ({t, date:d, done: ds.has(`${t.id}|${iso(d)}`)})); }
function overdueTasks(){
  const ds = doneSet(), t0 = today0(), out = [];
  for (const t of S.tasks) for (let i=1;i<=30;i++){ const d = addDays(t0,-i); if (occursOn(t,d) && !ds.has(`${t.id}|${iso(d)}`)) out.push({t, date:d, done:false, late:i}); }
  return out.sort((a,b) => b.late - a.late);
}

/* ---------- planned costs from supplies & health ---------- */
function plannedIn(ym){
  const today = today0(), curYm = ymOf(today);
  if (ym < curYm) return [];
  const mStart = parseISO(ym + "-01"), mEnd = parseISO(`${ym}-${daysIn(ym)}`), out = [];
  for (const col of ["supplies","health"]) for (const it of S[col]){
    const price = Number(it.price)||0, cyc = Number(it.cycle)||0;
    const first = nextDue(it);
    if (!first || !cyc || !price) continue;
    const n = Math.max(1, Math.round(Number(it.inst)||1));
    const seen = new Set();
    const add = (date0, overdue) => { const date = overdue ? date0 : alignFor(it, date0); if (seen.has(iso(date))) return; seen.add(iso(date)); const k = monthsBetween(ymOf(date), ym); if (k >= 0 && k < n) out.push({col, it, date, overdue, idx: k, n, amount: n >= 2 ? instPart(price, n, k) : price}); };
    const winStart = parseISO(ymAdd(ym, -(n - 1)) + "-01");
    let next = first;
    if (alignFor(it, next) < today){ add(today, true); next = addDays(today, cyc); }
    let guard = 0;
    const lo = addDays(winStart, -31), hi = addDays(mEnd, 31);
    while (next < lo && guard++ < 400) next = addDays(next, cyc);
    guard = 0;
    while (next <= hi && guard++ < 400){ const a = alignFor(it, next); if (a >= winStart && a <= mEnd) add(next, false); next = addDays(next, cyc); }
  }
  return out.sort((a,b) => a.date - b.date);
}

/* ---------- installments ---------- */
const monthsBetween = (a,b) => { const [ay,am] = a.split("-").map(Number), [by,bm] = b.split("-").map(Number); return (by*12+bm) - (ay*12+am); };
function instPart(total, n, idx){ total = Math.round(Number(total)||0); n = Math.max(1, Number(n)||1); const base = Math.floor(total / n); return idx === 0 ? total - base*(n-1) : base; }
function instIn(ym){
  return S.installments.map(p => { const i = monthsBetween(p.start, ym); return (i >= 0 && i < p.n) ? {p, idx:i, value: instPart(p.total, p.n, i)} : null; }).filter(Boolean);
}
function addInstallment(plan){
  const id = plan.id || uid(); saveDoc("installments", {...plan, id});
  toast(`已建立分期：共 ${plan.n} 期，每期約 ${money(instPart(plan.total, plan.n, 1))}`);
}
function recordsFor(col, id, date){
  if (!date) return [];
  const src = `${col}:${id}:${date}`;
  return S.installments.filter(p => p.src === src).map(p => ({kind:"inst", p}))
    .concat(Object.entries(S.spend).flatMap(([ym, m]) => (m.items||[]).filter(x => x.src === src).map(x => ({kind:"spend", ym, x}))));
}
const unitPrice = it => (Number(it.inst)||1) >= 2 ? instPart(it.price, it.inst, 0) : (Number(it.price)||0);

/* ---------- finance ---------- */
function fixedValue(it, ym, s){
  if (it.from && ym < it.from) return 0;
  if (it.to && ym > it.to) return 0;
  const a = Number(it.amount)||0;
  if (it.kind === "usd") return Math.round(a * (Number(s.fx?.usd)||0) * (1 + (Number(s.fx?.fee)||0)));
  if (it.kind === "weekday") return a * countWd(ym, it.weekdays);
  return a;
}
function fixedCash(it, ym, s){
  const c = Number(it.cash) || 0; if (!c || it.kind === "usd") return 0;
  if (it.from && ym < it.from) return 0;
  if (it.to && ym > it.to) return 0;
  return Math.min(fixedValue(it, ym, s), it.kind === "weekday" ? c * countWd(ym, it.weekdays) : c);
}
function carryInto(ym, s = S.settings){
  const st = startYm(); if (!s || ym < st) return 0;
  if (ym === st){
    const o = s.opening; if (!o || o.balance == null || o.balance === "") return 0;
    const oym = o.ym || ymAdd(st, -1);
    return (Number(o.balance)||0) - sum(S.spend[oym]?.items || [], x => Number(x.amount)||0);
  }
  return fin(ymAdd(ym, -1))?.remaining || 0;
}
function fin(ym){
  const s = S.settings; if (!s) return null;
  const so = s.salaryOverride?.[ym], salary = Number(so != null && so !== "" ? so : s.salary?.[ym])||0, bonus = Number(s.bonus?.[ym])||0;
  const t = s.tutor || {rate:0, weekdays:[], perDay:1};
  const sessions = countWd(ym, t.weekdays) * (Number(t.perDay)||1);
  const skip = Number(t.skip?.[ym])||0;
  const tutor = Math.max(0, sessions - skip) * (Number(t.rate)||0);
  const adjs = (s.salaryAdj||[]).filter(a => a.ym === ym && Number(a.amount)), adjTotal = sum(adjs, a => Number(a.amount)||0);
  const income = salary + bonus + tutor + adjTotal;
  const bchk = S.bills?.[ym]?.checked || {};
  const fixed = (s.fixed||[]).map(it => { const base = fixedValue(it, ym, s), ov = bchk[`fixed:${it.id}`]?.amount;
    const value = base > 0 && ov != null && ov !== "" ? Number(ov)||0 : base; return {...it, value, planned: base, cashValue: Math.min(value, fixedCash(it, ym, s))}; }).filter(x => x.planned > 0);
  const insts = instIn(ym);
  insts.forEach(x => fixed.push({name:`${x.p.name}（${x.idx+1}/${x.p.n}）`, group:"分期付款", value:x.value}));
  const groups = {};
  fixed.forEach(x => { const g = x.group || x.name; groups[g] = (groups[g]||0) + x.value; });
  const fixedTotal = sum(fixed, x => x.value), fixedCashTotal = sum(fixed, x => x.cashValue || 0);
  const savings = (s.savings||[]).map(x => ({...x, amount: saveAmt(x, ym, s)})).filter(x => x.amount > 0);
  const savingsTotal = sum(savings, x => Number(x.amount)||0);
  const meal = mealInfo(ym, s), mealBudget = meal?.budget || 0;
  const carryIn = carryInto(ym, s);
  const available = income - fixedTotal, free = available - mealBudget - savingsTotal + carryIn + (meal?.delta || 0);
  const items = (S.spend[ym]?.items || []).slice().sort((a,b) => b.date.localeCompare(a.date));
  const spent = sum(items, x => Number(x.amount)||0);
  const planned = plannedIn(ym), plannedTotal = sum(planned, x => x.amount);
  const otherSpent = sum(items.filter(x => !meal || x.cat !== meal.cat), x => Number(x.amount)||0);
  const remaining = free - otherSpent;
  return {ym, insts, adjs, adjTotal, salary, bonus, sessions, skip, tutor, income, fixed, groups, fixedTotal, fixedCashTotal, carryIn, savings, savingsTotal, available, free, items, spent, otherSpent, meal, mealBudget, remaining, planned, plannedTotal, afterPlanned: remaining - plannedTotal};
}

/* ---------- due items ---------- */
const payday = () => Number(S.settings?.payday ?? 5);
const isPaydayItem = it => S.supplies.includes(it) && Number(it.cycle) >= 28 && !it.snooze;
function payAlign(d){
  const pd = payday(), y = d.getFullYear(), m = d.getMonth();
  const c = [new Date(y, m-1, pd), new Date(y, m, pd), new Date(y, m+1, pd)];
  return c.reduce((best, x) => Math.abs(x - d) <= Math.abs(best - d) ? x : best);
}
const alignFor = (it, d) => d && isPaydayItem(it) ? payAlign(d) : d;
function nextDue(it){
  if (it.booked) return parseISO(it.booked);
  if (it.snooze) return parseISO(it.snooze);
  if (!it.last || !it.cycle) return null;
  return addDays(parseISO(it.last), Number(it.cycle));
}
function due(item, lead){
  const next = alignFor(item, nextDue(item));
  if (!next) return {next:null, days:null, level:"none", label:"未設定"};
  const days = dayDiff(next, new Date());
  if (item.booked) return {next, days, booked:true, level: days < 0 ? "crit" : "info",
    label: days < 0 ? `預約已過 ${-days} 天` : days === 0 ? `今天${item.bookedTime ? " " + item.bookedTime : ""}預約` : `已預約 ${mdEn(next)}${item.bookedTime ? " " + item.bookedTime : ""}`};
  const level = days < 0 ? "crit" : days <= lead ? "warn" : "ok";
  let label = days < 0 ? `已超過 ${-days} 天` : days === 0 ? "就是今天" : `還有 ${days} 天`;
  if (item.snooze) label += "・已延後";
  return {next, days, level, label};
}
function healthActs(it){
  const acts = it.booked ? [["book","改期"],["done","Done",true],["snooze","再拖一下"]] : [["book","Booked"],["done","Done",true],["snooze","再拖一下"]];
  return `<span class="acts">${acts.map(([a,l,main]) => `<button class="${main ? "btn sm gray" : "link"}" data-act="${a}" data-col="health" data-id="${it.id}">${l}</button>`).join("")}</span>`;
}
function healthReminders(){
  const lead = leadHealth();
  return S.health.map(it => ({it, x: due(it, lead)})).filter(r => r.x.next && r.x.days <= lead).sort((a,b) => a.x.days - b.x.days);
}
function reminderRows(list){
  return list.map(({it,x}) => `<div class="rowi" data-item="health" data-id="${it.id}"><span class="main"><span class="t">${x.booked ? esc(it.name) : `預約 ${esc(it.name)}`} <span class="tag ${x.level}">${x.label}</span></span>
    <span class="s">${x.booked ? [mdEn(x.next) + (it.bookedTime ? ` ${it.bookedTime}${it.bookedEnd ? "–" + it.bookedEnd : ""}` : ""), it.bookedWhere ? esc(it.bookedWhere) : ""].filter(Boolean).join("・") : `${mdEn(x.next)} 到期`}${it.price ? `・${money(unitPrice(it))}` : ""}</span></span>${healthActs(it)}</div>`).join("");

const leadSupply = () => Number(S.settings?.leadSupply ?? 7);
const leadSupplyTask = () => Number(S.settings?.leadSupplyTask ?? 3);
function supplyTasks(){
  const lead = leadSupplyTask();
  return S.supplies.map(it => ({it, x: due(it, lead)})).filter(r => r.x.next && r.x.days <= (isPaydayItem(r.it) ? 0 : lead)).sort((a,b) => a.x.days - b.x.days);
}
function supplyTaskRows(list){
  return list.map(({it,x}) => `<div class="rowi" data-item="supplies" data-id="${it.id}"><button class="check" role="checkbox" aria-checked="false" aria-label="已補貨 ${esc(it.name)}" data-act="restock" data-col="supplies" data-id="${it.id}"></button>
    <span class="main"><span class="t">補貨 ${esc(it.name)} <span class="tag ${x.days < 0 ? "crit" : "warn"}">${x.days < 0 ? `逾期 ${-x.days} 天` : x.days === 0 ? "今天" : `還有 ${x.days} 天`}</span></span>
    <span class="s"><span class="datepill">${mdEn(x.next)}</span>${it.cat ? `・${esc(it.cat)}` : ""}${it.price ? `・${money(unitPrice(it))}` : ""}</span></span></div>`).join("");
}

function workoutStats(ref){
  const g = goals(), ws = weekStart(ref), we = addDays(ws, 6);
  const all = allWorkouts();
  const gym = all.filter(x => x.type === "gym" && x.date >= iso(ws) && x.date <= iso(we)).length;
  const need = Math.max(0, g.gymPerWeek - gym), left = dayDiff(we, ref) + 1;
  const gymLevel = need === 0 ? "ok" : need > left ? "crit" : "warn";
  const gymLabel = need === 0 ? "本週達標" : need > left ? `本週剩 ${left} 天` : `還差 ${need} 次`;
  const racket = all.filter(x => x.type !== "gym" && x.date <= iso(ref)).sort((a,b) => b.date.localeCompare(a.date));
  const last = racket[0];
  let rLevel = "warn", rLabel = "兩週內安排一次", deadline = null;
  if (last){
    deadline = addDays(parseISO(last.date), g.racketDays);
    const d = dayDiff(deadline, ref);
    rLevel = d < 0 ? "crit" : d <= 4 ? "warn" : "ok";
    rLabel = d < 0 ? `已超過 ${-d} 天` : d === 0 ? "今天是期限" : `${mdEn(deadline)} 前（還有 ${d} 天）`;
  }
  return {gym, gymLevel, gymLabel, last, rLevel, rLabel, ws, we};
}

function lateByTask(){
  const m = new Map(); overdueTasks().forEach(x => { if (!m.has(x.t.id) || m.get(x.t.id).late < x.late) m.set(x.t.id, x); });
  return [...m.values()];
}
function eventsOn(d){
  const key = iso(d), ev = [], s = S.settings, isToday = key === iso(new Date());
  if (isToday) lateByTask().forEach(x => ev.push({type:"task", id:x.t.id, text:`${x.t.name}（逾期 ${x.late} 天）`, done:false}));
  tasksOn(d).forEach(x => ev.push({type:"task", id:x.t.id, text:x.t.name, done:x.done}));
  if (s?.tutor?.weekdays?.includes(d.getDay())) ev.push({type:"tutor", text:"家教"});
  workoutsOn(key).forEach(w => ev.push({type:"workout", id:w.id, text:WORKOUT[w.type]}));
  S.supplies.forEach(it => { const x = due(it, leadSupply()); if (!x.next) return;
    if (iso(x.next) === key) ev.push({type:"supply", id:it.id, text:`補貨 ${it.name}`});

}

function mealInfo(ym, s = S.settings){

  const cat = s.meal.cat || "餐飲", n = daysIn(ym), today = iso(new Date());
  const items = (S.spend[ym]?.items || []).filter(x => x.cat === cat);
  const byDay = {}; items.forEach(x => { byDay[x.date] = (byDay[x.date] || 0) + (Number(x.amount) || 0); });
  let delta = 0; const days = [];
  for (let d = 1; d <= n; d++){
    const k = `${ym}-${pad(d)}`, sp = byDay[k] || 0, diff = daily - sp, done = k < today;
    if (done || diff < 0) delta += diff;
    days.push({k, sp, diff, done, today: k === today});
  }
  return {daily, cat, n, budget: daily * n, spent: sum(items, x => Number(x.amount) || 0), delta, byDay, days, items,
    todaySpent: byDay[today] || 0, isCur: ym === today.slice(0, 7)};

function rangeDays(view, c, ym){

}
function openMeal(view, d, ym){
  const m = mealInfo(ym); if (!m) return;
  const days = rangeDays(view, parseISO(d), ym).filter(x => x >= startYm() + "-01"), today = iso(new Date()), daily = m.daily;
  if (!days.length) return;
  const items = spendIn(days).filter(x => x.cat === m.cat);
  const by = {}; items.forEach(x => (by[x.date] ||= []).push(x));
  const spent = sum(items, x => Number(x.amount)||0);
  const past = days.filter(x => x < today), ahead = days.filter(x => x >= today);
  const back = sum(past, k => daily - sum(by[k] || [], x => Number(x.amount)||0));
  const left = sum(ahead, k => daily - sum(by[k] || [], x => Number(x.amount)||0));
  const dayRows = days.slice().reverse().filter(k => k <= today || by[k]).map(k => {
    const xs = by[k] || [], sp = sum(xs, x => Number(x.amount)||0), diff = daily - sp, done = k < today;
    const right = `<span class="${diff < 0 ? "neg" : ""}">${done ? signed(diff) : diff < 0 ? `超過 ${money(-diff)}` : `剩 ${money(diff)}`}</span>`;
    const head = `<span class="cn">${mdEn(parseISO(k))}${k === today ? "・今天" : ""}<span class="note"> 已吃 ${money(sp)}</span></span><span class="cv">${right}</span>`;
    return xs.length ? `<details class="catd"><summary>${head}</summary>${xs.map(x => `<div class="fld tap" data-act="editSpendFromList" data-ym="${x.date.slice(0,7)}" data-id="${x.id}" style="grid-template-columns:1fr auto;cursor:pointer"><span>${esc(x.note || "餐費")}<br><span class="note">${x.pay === "cash" ? "現金" : "刷卡"}</span></span><span>${money(x.amount)}</span></div>`).join("")}</details>`
      : `<div class="catd"><div class="sumrow">${head}</div></div>`;
  }).join("");
  const label = view === "day" ? mdEn(parseISO(days[0])) : view === "week" ? `${mdEn(parseISO(days[0]))} – ${mdEn(parseISO(days[days.length-1]))}` : ymZh(ym);
  const F = (k, v, b, neg) => `<div class="fld" style="grid-template-columns:1fr auto${b ? ";font-weight:700" : ""}"><span>${k}</span><span class="${neg ? "neg" : ""}">${v}</span></div>`;
  dlg.innerHTML = `<form method="dialog">
    <div class="dlg-bar"><span style="width:52px"></span><h2>餐費・${label}</h2><button class="link" type="button" data-act="close" style="font-weight:600">完成</button></div>
    <div class="dlg-body">
      <div class="group">${F("預算", `${money(daily)} × ${days.length} 天 = ${money(daily * days.length)}`)}${F("已吃", money(spent))}
        ${past.length ? F("已過的日子回流", signed(back), false, back < 0) : ""}
        ${ahead.length ? F("還能吃", money(left), true, left < 0) : ""}</div>
      ${dayRows ? `<div class="group">${dayRows}</div>` : ""}
    </div></form>`;
  if (!dlg.open) dlg.showModal();
}
function widgets(ym, view = "month", cursor){
  const f = fin(effYm(ym));
  if (!f) return `<p class="empty">還沒有財務設定，請到 Finance 建立。</p>`;
  const shifted = f.ym !== ym, today = iso(new Date()), isCur = f.ym === today.slice(0,7);
  const daysLeft = isCur ? daysIn(f.ym) - new Date().getDate() + 1 : f.ym < today.slice(0,7) ? 0 : daysIn(f.ym);
  const used = f.free - f.remaining, pct = f.free > 0 ? Math.max(0, Math.min(100, used / f.free * 100)) : (used > 0 ? 100 : 0);
  const avg = daysLeft ? Math.max(0, f.afterPlanned) / daysLeft : 0;
  // range for this view
  const c = cursor || parseISO((ym === today.slice(0,7) ? today : ym + "-01"));
  const days = rangeDays(view, c, f.ym);
  const L = view === "day" ? (days[0] === today ? "今天" : `${Number(days[0].slice(5,7))}/${Number(days[0].slice(8))}`) : view === "week" ? "這週" : "這個月";
  const L2 = view === "day" ? (days[0] === today ? "今日" : L) : view === "week" ? "本週" : "本月";
  const mc = S.settings?.meal?.daily ? mealCat() : null, all = spendIn(days);
  const start = startYm() + "-01", bdays = days.filter(d => d >= start), bset = new Set(bdays);
  const mealSp = mc ? sum(all.filter(x => x.cat === mc && bset.has(x.date)), x => Number(x.amount)||0) : 0, allSp = sum(all, x => Number(x.amount)||0);
  const allMeal = mc ? sum(all.filter(x => x.cat === mc), x => Number(x.amount)||0) : 0;
  const ahead = bdays.filter(d => d >= today), daily = Number(S.settings?.meal?.daily) || 0;
  const mealLeft = sum(ahead, d => daily - sum(all.filter(x => x.cat === mc && x.date === d), x => Number(x.amount)||0));
  const freeLeft = view === "day" ? (ahead.length ? avg : 0) : avg * ahead.filter(d => d.slice(0,7) === f.ym).length;
  const line = (k, v, sub, neg, bar, act) => `<div class="wl tapw" role="button" tabindex="0" data-act="${act}" data-view="${view}" data-d="${iso(c)}" data-ym="${f.ym}"><span class="wk">${k} ›</span><span class="wv ${neg ? "neg" : ""}">${money(v)}</span>${sub ? `<span class="x">${sub}</span>` : ""}${bar || ""}</div>`;
  const otherSp = allSp - allMeal;
  const freeBar = view === "month" ? meter(f.free > 0 ? used / f.free * 100 : (used > 0 ? 100 : 0), used > f.free)
    : (() => { const ob = sum(all.filter(x => bset.has(x.date) && x.cat !== mc), x => Number(x.amount)||0); return meter(ob + freeLeft > 0 ? ob / (ob + freeLeft) * 100 : 0, false); })();
  const mb = daily * bdays.length, mealBar = meter(mb ? mealSp / mb * 100 : 0, mealSp > mb);
  return `<div class="widgets">
    <button type="button" class="wdg wbtn" data-act="spentDetail" data-view="${view}" data-d="${iso(c)}" data-ym="${f.ym}"><span class="k">${L2}已花 ›</span><span class="n">${money(allSp)}</span><span class="x">${mc ? `餐費 ${money(allMeal)}・其他 ${money(otherSp)}` : `${all.length} 筆`}</span></button>
    ${!bdays.length ? (() => { const st = startYm(), pm = Number(ymAdd(st,-1).slice(5)), o = S.settings?.opening, cin = carryInto(st);
      return `<button type="button" class="wdg wbtn" data-act="carryDetail" data-ym="${st}"><span class="k">${pm} 月剩下 ›</span><span class="n ${cin < 0 ? "neg" : ""}">${money(cin)}</span><span class="x">${o?.balance != null ? `${money(Number(o.balance)||0)} − 已記帳 ${money((Number(o.balance)||0) - cin)}・` : ""}轉入 ${Number(st.slice(5))} 月</span></button>`; })() : `
    <div class="wdg"><span class="k">${L}還可以花</span><div class="wpair">
      ${line("自由花用", freeLeft, view === "day" ? "" : `平均每天 ${money(avg)}`, false, freeBar, "freeDetail")}
      ${mc ? line("餐費", mealLeft, `已吃 ${money(mealSp)} / ${money(mb)}`, mealLeft < 0, mealBar, "mealDetail") : ""}</div>
      ${f.plannedTotal ? `<button type="button" class="wlink pl" data-act="plannedDetail" data-ym="${f.ym}" style="margin-top:6px">已扣預計補貨 ${money(f.plannedTotal)} ›</button>` : ""}</div>`}
  </div>`;
}

function dailySec(ym, f){

function trendSec(ym){
  const st = startYm(), months = [...Array(9)].map((_,i) => ymAdd(st, i)), cur = ymOf(new Date());
  const rows = months.map(m => { const f = fin(m), mealUse = f.mealBudget - (f.meal?.delta || 0);
    const segs = [["固定", f.fixedTotal, "var(--c-fixed)"], ["餐費", mealUse, "var(--c-meal)"], ["花費＋補貨", f.otherSpent + f.plannedTotal, "var(--c-spend)"], ["儲蓄", f.savingsTotal, "var(--c-save)"]];
    const outT = sum(segs, x => Math.max(0, x[1]));
    return {m, inc: f.income, segs, outT, net: f.income - outT}; });
  const W = Math.round((app.clientWidth || 900) - 28), H = 210, L = 36, R = 6, T = 18, B = 24, iw = W - L - R, ih = H - T - B;
  const maxV = Math.max(...rows.map(r => Math.max(r.inc, r.outT)), 1000);
  const step = maxV > 60000 && W < 500 ? 20000 : 10000, top = Math.ceil(maxV / step) * step, y = v => T + ih - v / top * ih;

    o += `<rect x="${x1}" y="${y(r.inc)}" width="${bw}" height="${y(0) - y(r.inc)}" rx="2" fill="var(--c-inc)" data-tip="${ymZh(r.m)} 收入\n${money(r.inc)}\n結餘 ${signed(r.net)}"/>`;

    <div class="chart-legend"><span><i style="background:var(--c-inc)"></i>收入</span><span><i style="background:var(--c-fixed)"></i>固定</span><span><i style="background:var(--c-meal)"></i>餐費</span><span><i style="background:var(--c-spend)"></i>花費＋補貨</span><span><i style="background:var(--c-save)"></i>儲蓄</span><span>上方數字：收入 − 支出 − 儲蓄</span></div>`,
    `${Number(months[0].slice(5))}月–${Number(months[8].slice(5))}月：儲蓄 ${wan(totSave)}・結餘 ${totNet >= 0 ? "+" : "−"}${wan(Math.abs(totNet))}`);
}

/* ---------- 預扣清單 ---------- */
function billItems(ym){
  const f = fin(ym); if (!f) return [];
  const chk = S.bills?.[ym]?.checked || {}, out = [];
  for (const x of f.fixed){
    if (x.noList) continue;
    const key = `fixed:${x.id}`, c = chk[key];
    out.push({key, kind: "fixed", name: x.name, amount: x.value, planned: x.planned, done: !!c,
      sub: x.kind === "weekday" ? `${countWd(ym, x.weekdays)} 次` : x.kind === "usd" ? `US$${x.amount}` : "", variable: x.kind === "weekday" || x.group === "交通", id: x.id});
  }
  for (const x of f.insts){
    const key = `inst:${x.p.id}:${x.idx}`;
    out.push({key, kind: "inst", name: /^(supplies|health):/.test(String(x.p.src||"")) ? x.p.name.replace(/^[^：]+：/, "") : x.p.name, amount: x.value, done: !!chk[key], sub: `分期 ${x.idx+1}/${x.p.n}`});
  }

    for (const it of S[col]){
      const pre = `${col}:${it.id}:`;

      recs.forEach(r => out.push({key: `rec:${r.id}`, kind: col, name: it.name, amount: Number(r.amount)||0, done: true, sub: `${mdEn(parseISO(r.date))} 完成`, col, id: it.id, rec: r}));
      const startedHere = S.installments.some(pl => String(pl.src||"").startsWith(pre) && pl.start === ym);
      if (startedHere && !recs.length) out.push({key: `started:${col}:${it.id}`, kind: col, name: it.name, amount: 0, done: true, sub: "已完成・分期中", col, id: it.id});
    }
    const byItem = {};
    f.planned.filter(p => p.col === col).forEach(pl => (byItem[pl.it.id] ||= []).push(pl));
    for (const pls of Object.values(byItem)){
      const pl = pls[0], cnt = pls.length;
      out.push({key: `plan:${col}:${pl.it.id}`, kind: col, name: pl.it.name, amount: sum(pls, x => x.amount), done: false, col, id: pl.it.id, due: pl.date,
        sub: [cnt > 1 ? `還有 ${cnt} 次・下次 ${pl.overdue ? "已到期" : mdEn(pl.date)}` : (pl.overdue ? "已到期" : mdEn(pl.date)), pl.n >= 2 ? `分期 ${pl.idx+1}/${pl.n}` : ""].filter(Boolean).join("・")});
    }
  }
  return out;
}

function recurStats(ym){
  const f = fin(ym), M = 30.44, groups = [];
  const fx = Object.entries(f.groups).filter(([g]) => g !== "分期付款").map(([g, v]) => ({name: g, v,
    sub: f.fixed.filter(x => (x.group||x.name) === g).length > 1 ? f.fixed.filter(x => (x.group||x.name) === g).map(x => `${x.name} ${money(x.value)}`).join("・") : ""}));
  groups.push({name: "固定支出", c: "var(--c-fixed)", items: fx});
  if (f.meal) groups.push({name: "餐費", c: "var(--c-meal)", items: [{name: "餐費", v: f.mealBudget, sub: `${money(f.meal.daily)} × ${f.meal.n} 天`}]});
  const per = (col) => S[col].map(it => {
    const pre = `${col}:${it.id}:`;
    const act = (S.spend[ym]?.items || []).filter(x => String(x.src||"").startsWith(pre));
    const ins = f.insts.filter(x => String(x.p.src||"").startsWith(pre));
    const pl = f.planned.filter(p => p.col === col && p.it.id === it.id);
    const v = sum(act, x => Number(x.amount)||0) + sum(ins, x => x.value) + sum(pl, p => p.amount);
    const sub = [...act.map(x => `${mdEn(parseISO(x.date))} 已付`), ...ins.map(x => `分期 ${x.idx+1}/${x.p.n}`),
      ...pl.map(p => p.n >= 2 ? `分期 ${p.idx+1}/${p.n}（預計）` : `${p.overdue ? "已到期" : mdEn(p.date)} 預計`)].join("・");
    return {name: it.name, v, sub, col, id: it.id};
  }).filter(x => x.v > 0);
  groups.push({name: "補貨", c: "var(--c-spend)", hatch: true, items: per("supplies")});
  const careAll = per("health");
  pages().forEach(pg => groups.push({name: pg.name, c: "var(--c-spend)", items: careAll.filter(x => pageOf(careItem(x.id)) === pg.id)}));
  const inst = f.insts.filter(x => !/^(supplies|health):/.test(String(x.p.src||""))).map(x => ({name: x.p.name, v: x.value, sub: `分期 ${x.idx+1}/${x.p.n}`}));
  if (inst.length) groups.push({name: "其他分期", c: "var(--c-inc)", items: inst});
  groups.forEach(g => { g.items.sort((a,b) => b.v - a.v); g.v = sum(g.items, x => x.v); });
  const total = sum(groups, g => g.v);
  return {groups: groups.filter(g => g.v > 0).sort((a,b) => b.v - a.v), total};
}
function recurSection(ym){
  const {groups, total} = recurStats(ym); if (!total) return "";
  const all = groups.flatMap(g => g.items), max = Math.max(...groups.map(g => g.v));
  const pct = v => total ? `${(v / total * 100).toFixed(v / total < 0.1 ? 1 : 0)}%` : "0%";
  const body = groups.map((g,i) => `<details class="catd"><summary><span class="cn">${g.name}<span class="note"> ${g.items.length} 項</span></span><span class="cv">${money(g.v)}<span class="note"> ${pct(g.v)}</span></span>${meter(g.v / max * 100).replace('<span style="', `<span class="${g.hatch ? "hatch" : ""}" style="background:${g.c};`)}</summary>
    ${g.items.map(x => `<div class="ritem ${x.id ? "tap" : ""}" ${x.id ? `data-act="plEdit" data-col="${x.col}" data-id="${x.id}" role="button" tabindex="0"` : ""}><span>${esc(x.name)}${x.sub ? `<br><span class="note">${esc(x.sub)}</span>` : ""}</span><span class="rv">${money(x.v)}<span class="note"> ${pct(x.v)}</span></span></div>`).join("")}</details>`).join("");
  const top = all.slice().sort((a,b) => b.v - a.v).slice(0, 5);
  return sec("Recurring", `<div class="recur-bar" role="img" aria-label="各類別比例">${groups.map((g,i) => `<span class="${g.hatch ? "hatch" : ""}" style="flex:${g.v};background:${g.c}" data-tip="${g.name}\n${money(g.v)}（${pct(g.v)}）"></span>`).join("")}</div>
    <div class="recur-legend">${groups.map((g,i) => `<span><i class="${g.hatch ? "hatch" : ""}" style="background:${g.c}"></i>${g.name} ${pct(g.v)}</span>`).join("")}</div>
    <div class="group" style="margin:0;box-shadow:none">${body}</div>
    <div class="pad note">前五大：${top.map(x => `${esc(x.name)} ${pct(x.v)}`).join("・")}</div>`, `${ymZh(ym)}約 ${money(total)}`);
}

async function saveGEvent(fd, id, evCal){
  const cal = (id && evCal) || S.settings?.gcalTarget; if (!mcp || !cal) return toast("Google 日曆還沒連好");
  const date = fd.get("date"), all = !!fd.get("allday");
  let st = fd.get("st") || "10:00", et = fd.get("et") || "11:00"; if (!all && et <= st) et = st;
  const times = all ? {allDay: true, startTime: date + "T00:00:00", endTime: plus1(date) + "T00:00:00"}
                    : {startTime: `${date}T${st}:00`, endTime: `${date}T${et}:00`};
  const body = {calendarId: cal, summary: String(fd.get("title")).trim(), location: String(fd.get("loc")||"").trim(), description: String(fd.get("desc")||"").trim(), ...times};
  toast(id ? "更新中…" : "新增中…");
  try {
    if (id) await mcp.callTool(GCAL, "update_event", {...body, eventId: id, notificationLevel: "NONE"});
    else await mcp.callTool(GCAL, "create_event", {...body, notificationLevel: "NONE"});
    await mcp.invalidate?.(GCAL, "list_events").catch(() => {});
    toast(id ? "已更新 Google 日曆" : "已新增到 Google 日曆");
  } catch (err) {
    toast(err?.code === "approval_required" ? "需要允許修改 Google 日曆，請再按一次" : err?.code === "needs_reauth" ? "Google 日曆需要重新連接" : "沒有成功，請稍後再試");
  }
}
async function delGEvent(e){
  if (!mcp || !e?.id) return;
  try { await mcp.callTool(GCAL, "delete_event", {calendarId: e.cal, eventId: e.id, notificationLevel: "NONE"}); await mcp.invalidate?.(GCAL, "list_events").catch(() => {}); toast(`已刪除「${e.text}」`); }
  catch (err) { toast("刪除沒有成功，請稍後再試"); }
}

/* ---------- settings edits ---------- */
function setPath(obj, path, val){
  const ks = path.split("."); let o = obj;
  for (let i=0;i<ks.length-1;i++){ if (o[ks[i]] == null || typeof o[ks[i]] !== "object") o[ks[i]] = {}; o = o[ks[i]]; }
  const last = ks[ks.length-1];
  if (val === "" || val == null) delete o[last]; else o[last] = val;
}
function getPath(obj, path){ return path.split(".").reduce((o,k) => o?.[k], obj); }

app.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.gtarget !== undefined && S.settings){
    const c = (S.calList||[]).find(x => x.id === el.value);
    S.settings.gcalTarget = el.value || ""; S.settings.gcalTargetName = c?.summary || ""; ui.openSettings = true; gcalWatchKey = null; saveSettings(); schedulePush(); return;
  }
  if (el.dataset.gshow !== undefined && S.settings){
    const cur = new Set(readCals().map(x => x === "primary" ? (S.calList||[])[0]?.id || x : x));
    el.checked ? cur.add(el.value) : cur.delete(el.value);
    S.settings.gcalShow = [...cur]; delete S.settings.gcalShowPrimary; ui.openSettings = true; gcalWatchKey = null; saveSettings(); return;
  }
  if (el.dataset.sheetlink !== undefined && S.settings){
    const v = el.value.trim(), m = v.match(/\/d\/([\w-]{20,})/) || v.match(/^([\w-]{20,})$/);
    if (!m) { el.value = `https://docs.google.com/spreadsheets/d/${sheetId()}/edit`; return toast("看不懂這個連結"); }
    S.settings.sheetId = m[1]; saveSettings(); sheetSync(true); return toast("已換成新的試算表");
  }
  if (el.dataset.sheet !== undefined && S.settings){ S.settings.sheetSyncOff = !el.checked; saveSettings(); if (el.checked) sheetSync(true); return; }
  if (el.dataset.cardon !== undefined && S.settings){ if (el.checked) delete S.settings.cardOff; else S.settings.cardOff = true; ui.openSettings = true; return saveSettings(); }
  if (el.dataset.gsync !== undefined && S.settings){ S.settings.gsyncOff = !el.checked; ui.openSettings = true; saveSettings(); if (el.checked) schedulePush(); return; }
  if (el.dataset.pagename !== undefined && S.settings){
    const ps = clone(pages()), i = Number(el.dataset.pagename), nv = el.value.trim(); if (!ps[i]) return;
    if (!nv || nv === ps[i].name) { el.value = ps[i].name; return; }
    if (ps.some((p, j) => j !== i && p.name === nv)) { el.value = ps[i].name; return toast("已經有這個分頁了"); }
    ps[i].name = nv; S.settings.pages = ps; ui.openSettings = true; return saveSettings();
  }
  if (el.dataset.cat !== undefined && S.settings){
    const i = Number(el.dataset.cat), cats = supplyCats().slice(), old = cats[i], nv = el.value.trim();
    if (!nv || nv === old) { el.value = old; return; }
    if (cats.includes(nv)) { el.value = old; return toast("已經有這個類別了"); }
    cats[i] = nv;
    S.supplies.filter(x => x.cat === old).forEach(x => saveDoc("supplies", {...x, cat: nv}));
    return setCats(cats);
  }
  if (el.dataset.billlist !== undefined && S.settings){
    const it = S.settings.fixed?.[Number(el.dataset.billlist)]; if (!it) return;
    if (el.checked) delete it.noList; else it.noList = true;
    ui.openSettings = true; return saveSettings();
  }
  if (el.dataset.bind && S.settings){
    let v = el.value;
    if (el.dataset.bind === "fx.feePct"){ S.settings.fx = S.settings.fx || {}; S.settings.fx.fee = (Number(v)||0)/100; ui.openSettings = true; return saveSettings(); }
    if (el.dataset.type !== "text") v = v === "" ? "" : Number(v);
    setPath(S.settings, el.dataset.bind, v);
    ui.openSettings = true; saveSettings();
  } else if (el.dataset.wd && S.settings){
    const arr = new Set(getPath(S.settings, el.dataset.wd) || []);
    const w = Number(el.value); el.checked ? arr.add(w) : arr.delete(w);
    setPath(S.settings, el.dataset.wd, [...arr].sort());
    ui.openSettings = true; saveSettings();
  }
});

app.addEventListener("submit", e => {
  const fm = e.target;
  if (fm.dataset.form === "buyadd"){
    e.preventDefault();
    const nv = String(new FormData(fm).get("name")||"").trim(); if (!nv) return;
    saveDoc("shopping", {id: uid(), name: nv, qty: 1, cat: "日用品", done: false, created: new Date().toISOString()});
    setTimeout(() => document.getElementById("buy-new")?.focus(), 30); return;
  }
  if (fm.dataset.form === "spendcat2"){
    e.preventDefault();
    const nv = String(new FormData(fm).get("name")||"").trim(); if (!nv) return;
    const cats = spendCats().slice(); if (cats.includes(nv)) return toast("已經有這個類別了");
    cats.push(nv); S.settings.spendCats = cats; saveSettings(); return toast(`已新增類別：${nv}`);
  }
  if (fm.dataset.form === "page"){
    e.preventDefault();
    const nv = String(new FormData(fm).get("name")||"").trim(); if (!nv || !S.settings) return;
    const ps = pages().slice(); if (ps.some(p => p.name === nv)) return toast("已經有這個分頁了");
    if (ps.length >= MAX_PAGES) return toast(`最多 ${MAX_PAGES} 個分頁`);
    ps.push({id: uid(), name: nv}); S.settings.pages = ps; ui.openSettings = true; saveSettings(); return toast(`已新增分頁：${nv}`);
  }
  if (fm.dataset.form === "cat"){
    e.preventDefault();
    const nv = String(new FormData(fm).get("name")||"").trim(); if (!nv) return;
    const cats = supplyCats().slice(); if (cats.includes(nv)) return toast("已經有這個類別了");
    cats.push(nv); setCats(cats); return toast(`已新增類別：${nv}`);
  }
  if (fm.dataset.form === "meal"){
    e.preventDefault();
    const d = new FormData(fm), amount = Number(d.get("amount")); if (!amount) return toast("請輸入金額");
    addMonthItem("spend", {date: d.get("date"), amount, cat: mealCat(), note: String(d.get("note")||"").trim(), ...payOf(d)});
    return toast(`餐費 ${money(amount)}`);
  }
  if (fm.dataset.form !== "spend") return;
  e.preventDefault();
  const d = new FormData(fm), amount = Number(d.get("amount"));
  if (!amount) return toast("請輸入金額");
  const note = String(d.get("note")||"").trim(), cat = d.get("cat") || "其他", n = Math.round(Number(d.get("n"))||0);
  if (d.get("inst") && n >= 2) return addInstallment({name: note || cat, cat, total: amount, n, start: String(d.get("date")).slice(0,7), date: d.get("date")});
  const entry = {date: d.get("date"), amount, cat, note, ...payOf(d)}, bm = billMatch(entry.date.slice(0,7), note);
  if (bm) { fm.reset?.(); return askBillMatch(entry, bm); }
  addMonthItem("spend", entry);
  toast(`已記錄 ${money(amount)}`);
});

let toastTimer;
function toast(msg, undo){
  let t = document.querySelector(".toast"); if (t) t.remove();
  t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status"); document.body.appendChild(t);
  const span = document.createElement("span"); span.textContent = msg; t.appendChild(span);
  if (undo){ const b = document.createElement("button"); b.type = "button"; b.className = "toast-undo"; b.textContent = "復原";
    b.onclick = () => { undo(); t.remove(); }; t.appendChild(b); }
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), undo ? 5000 : 2000);
}

/* ---------- Google Calendar ---------- */
const GCAL = "Google Calendar";
const GPREFIX = "👾 ";
S.gsync = null;   // {map:{key:{id,sig}}}
const gsyncIds = () => new Set(Object.values(S.gsync?.map || {}).map(x => x.id));
let mcp = null, gcalWatchKey = null, gcalUnsub = null, gcalInput = null;
function readCals(){
  const st = S.settings || {};
  if (Array.isArray(st.gcalShow)) return st.gcalShow.slice();
  const out = []; if (st.gcalTarget) out.push(st.gcalTarget); if (st.gcalShowPrimary) out.push("primary");
  return out;
}
function gcalRange(){
  const ym = ymOf(ui.cursor), first = parseISO(ym + "-01"), start = addDays(weekStart(first), -7), end = addDays(start, 49);
  const cals = readCals();
  return {key: ym + "|" + cals.join(","), cals, input: {startTime: iso(start) + "T00:00:00", endTime: iso(end) + "T00:00:00", orderBy: "startTime", pageSize: 250}};
}
let gcalOrphans = {};
function parseGcal(payload, cal){
  const out = {}, list = (payload && payload.events) || [];
  if (cal === S.settings?.gcalTarget && S.gsync){
    const ids = gsyncIds(), old = Date.now() - 10 * 60 * 1000, orph = {};
    for (const e of list){
      const base = e.recurringEventId || e.id;
      if (e.status !== "cancelled" && String(e.summary||"").startsWith(GPREFIX) && /來自 👾👾👾/.test(e.description||"") && !ids.has(base)
        && Date.parse(e.created || 0) < old) orph[base] = true;
    }
    gcalOrphans[cal] = Object.keys(orph);
    if (gcalOrphans[cal].length) schedulePush();
  }
  for (const e of list){
    if (e.status === "cancelled") continue;
    if (String(e.summary||"").startsWith(GPREFIX) || gsyncIds().has(e.id) || gsyncIds().has(e.recurringEventId)) continue;
    if ((e.attendees||[]).some(a => a.self && a.responseStatus === "declined")) continue;
    const allDay = !e.start?.dateTime, s0 = String(e.start?.dateTime || e.start?.date || "").slice(0,10); if (!s0) continue;
    const e0 = String(e.end?.dateTime || e.end?.date || s0).slice(0,10);
    const time = allDay ? "整天" : `${e.start.dateTime.slice(11,16)}–${String(e.end?.dateTime||"").slice(11,16)}`;

    restore = () => { const cur = clone(S[col][ym] || {items:[]}); cur.items.push(entry); S[col][ym] = cur; saveMonthDoc(col, ym);
      linked.forEach(([m, x]) => { const c2 = clone(S.spend[m] || {items:[]}); c2.items.push(x); S.spend[m] = c2; saveMonthDoc("spend", m); }); };

let openRow = null;

let sx = 0, sy = 0, swRow = null, swDx = 0, swMode = null, swiped = false;
app.addEventListener("touchstart", e => {
  const r = e.target.closest(".rowi.sw"); swiped = false;

}, {passive:true});
app.addEventListener("touchmove", e => {

  if (swMode !== "x") return;
  e.preventDefault();
  const base = swRow.classList.contains("open-l") ? -ACT_W*2 : swRow.classList.contains("open-r") ? ACT_W*2 : 0;
  swDx = Math.max(-ACT_W*2.4, Math.min(ACT_W*2.4, base + dx));
  swRow.classList.toggle("from-left", swDx > 0);

}, {passive:false});
app.addEventListener("touchend", () => {
  if (!swRow || swMode !== "x") { swRow = null; return; }
  swiped = true;
  const c = swRow.querySelector(".sw-content"); c.style.transition = "";
  if (Math.abs(swDx) > 50){
    const left = swDx > 0; swRow.classList.add("open", left ? "open-r" : "open-l"); swRow.classList.remove(left ? "open-l" : "open-r");

/* ---------- boot ---------- */
function setSync(text){ document.getElementById("sync").textContent = text; }
async function boot(){
  route();

  if (!db){ setSync("離線預覽：變更不會保存"); render(); return; }

  const err = e => { if (e?.code === "revoked") { db = null; setSync("連線已中斷"); } };
  db.doc("life/settings").onSnapshot(snap => {
    const next = snap.exists ? clone(snap.data()) : null;
    if (JSON.stringify(next) === JSON.stringify(S.settings)) return;
    const ae = document.activeElement;
    S.settings = next;
    if (ae && ae.matches && ae.matches("input,select") && app.contains(ae) && snap.metadata?.hasPendingWrites) return;
    render();
  }, err);
  db.doc("life/gsync").onSnapshot(snap => { const first = !S.gsync; S.gsync = snap.exists ? clone(snap.data()) : {map:{}}; if (first) schedulePush(); }, err);
  for (const col of ["supplies","health","tasks","installments","shopping"])

  for (const col of ["spend","workouts","taskdone","bills"])
    db.collection(col).onSnapshot(q => { S[col] = Object.fromEntries(q.docs.map(d => [d.id, clone(d.data())])); render(); }, err);
}
boot();
